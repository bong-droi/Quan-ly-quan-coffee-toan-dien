<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Báo cáo Doanh thu{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        :root {
            --coffee-brown: #8B4513;
            --coffee-light: #A0522D;
            --coffee-cream: #f9f5f0;
            --coffee-beige: #f0e6d6;
            --coffee-border: #e6d5c3;
            --coffee-text: #5c3d2e;
            --coffee-muted: #a0785a;
        }
        
        body {
            background: linear-gradient(135deg, var(--coffee-cream) 0%, var(--coffee-beige) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--coffee-text);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .content-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.1);
            border: 2px solid var(--coffee-border);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--coffee-brown) 0%, var(--coffee-light) 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--coffee-light) 0%, var(--coffee-brown) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 69, 19, 0.3);
        }
        
        .btn-outline-primary {
            border-color: var(--coffee-brown);
            color: var(--coffee-brown);
            border-radius: 10px;
        }
        
        .btn-outline-primary:hover {
            background-color: var(--coffee-brown);
            border-color: var(--coffee-brown);
        }
        
        .text-primary {
            color: var(--coffee-brown) !important;
        }
        
        .table th {
            background-color: #fff8f0;
            color: var(--coffee-text);
            border-color: var(--coffee-border);
            font-weight: 600;
        }
        
        .table td {
            border-color: var(--coffee-border);
        }
        
        .badge.bg-success {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%) !important;
            color: #2e7d32 !important;
            border: 1px solid #c8e6c9;
        }
        
        .badge.bg-info {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%) !important;
            color: #1565c0 !important;
            border: 1px solid #bbdefb;
        }
        
        h1, h2, h3, h4, h5, h6 {
            color: var(--coffee-brown);
            font-weight: 700;
        }
        
        .text-muted {
            color: var(--coffee-muted) !important;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="content-container">
        <div class="header mb-4" style="text-align: center; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 8px 25px rgba(139, 69, 19, 0.1); border: 2px solid var(--coffee-border);">
            <h1 style="color: var(--coffee-brown); font-size: 36px; margin-bottom: 10px;">
                <i class="bi bi-graph-up"></i> BÁO CÁO THỐNG KÊ
            </h1>
            <p style="color: var(--coffee-muted); font-size: 18px;">Coffee Shop Management System</p>
        </div>
        
        {% block report_content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
